docs_evidence: >-
  https://adsmom.com/product/api describes two integration paths only —
  "Connect your AI assistant over MCP" and "call the REST API from your own
  code" — and points the reader to the Integrations section of a logged-in
  account for credentials and endpoints. No SDK, sample repo or client library
  is offered on any public page.

implications:
- Every REST integrator hand-rolls a client. The published OpenAPI makes
  generation possible (78 operations, unique operationIds, 110 schemas), but the
  hostless servers[] block means a generated client will not compile against a
  base URL without the fix in overlays/adsmom-inc-openapi-overlay.yaml.
- No SDKs pointer is emitted in apis.yml. An empty package list is an honest
  zero, not an SDK surface.
- The MCP server is remote-only, so the absence of a package does NOT block
  agent access — this is a REST-side gap, not an agent-side one.

