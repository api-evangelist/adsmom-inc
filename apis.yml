apis:
- name: Adsmom REST API
  description: >-
    Stable REST API over the Adsmom ad index. 78 operations across Explore (list,
    hydrate and detail Meta/TikTok/Google/LinkedIn ads, plus reach and impression
    timeseries and point-in-time snapshots), Insights (track and untrack
    advertisers and organic accounts, AI insight summaries, weekly reports) and
    Analytics (reach over time and by region, new/active ad activity, share of
    voice via Lorenz/Gini, runtime distribution, creative mix and targeting
    overlap). Authenticated with OAuth 2.0 bearer JWTs issued by
    app.adsmom.com; credentials are created from the Integrations section of a
    paid account.
  humanURL: https://adsmom.com/product/api
