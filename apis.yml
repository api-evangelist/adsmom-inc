aid: adsmom-inc
name: Adsmom Inc.
description: >-
  Adsmom (SIA Adsmom) is a Latvia-based AI-powered ad intelligence platform that
  indexes 200M+ ads from Meta, TikTok and Google, decodes them with AI, and gives
  brands, agencies and research teams a clear read on what competitors are running
  and what is actually working. The platform covers ad search across a competitor
  library, spend and creative-strategy insights, an AI chat analyst ("Sense"),
  real-time competitor alerts, and branded reporting. Adsmom exposes its ad index
  programmatically via both a hosted Model Context Protocol (MCP) server — for
  connecting AI assistants such as Claude, Codex, Cursor and Gemini — and a REST
  API for server-to-server pipelines, internal tools and scheduled jobs. API and
  MCP access are included on all paid tiers. Adsmom is a 500 Global portfolio
  company and raised ~$610K in early 2025.
